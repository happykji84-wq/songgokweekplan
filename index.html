<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>송곡초등학교 주간 교육계획</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* 토스트 알림 애니메이션 */
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s ease-out; }
        
        /* 드래그 앤 드롭 스타일 */
        .drag-over { background-color: rgba(13, 148, 136, 0.1) !important; border: 2px dashed #0d9488 !important; }
        .dragging { opacity: 0.4; }

        /* 입력칸(셀) 최소 높이 증가 및 하단 여백 최소화 */
        .min-h-\[75px\] { min-height: 110px !important; }
        .min-h-\[60px\] { min-height: 80px !important; }
        body { justify-content: flex-start !important; padding-bottom: 4px; }

        /* 추가(+) 버튼 크기 및 가시성 향상 */
        .group\/cell .add-btn {
            width: 26px !important;
            height: 26px !important;
            font-size: 20px !important;
            line-height: 1 !important;
            opacity: 0.5 !important; /* 평소에도 연하게 보이도록 설정 */
            background-color: #f0fdfa !important; /* 옅은 민트색 배경 */
            color: #0f766e !important;
            border-radius: 6px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 0 !important;
            right: 6px !important;
            top: 6px !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05) !important;
        }
        .group\/cell:hover .add-btn, .group\/cell .add-btn:focus {
            opacity: 1 !important;
            background-color: #ccfbf1 !important; /* 마우스 오버시 배경색 진하게 */
        }

        /* 표 테두리 선 굵기 및 색상 강조 */
        .overflow-x-auto.border { 
            border-width: 2px !important; 
            border-color: #9ca3af !important; 
        }
        .overflow-x-auto .border-b { 
            border-bottom-width: 2px !important; 
            border-color: #9ca3af !important; 
        }
        .overflow-x-auto .border-r { 
            border-right-width: 2px !important; 
            border-color: #9ca3af !important; 
        }

        /* 인쇄용 스타일 설정 (A4 가로 방향 최적화) */
        @media print {
            @page {
                size: A4 landscape;
                margin: 5mm;
            }
            html, body { 
                height: 100vh !important;
                background: white !important; 
                padding: 0 !important; 
                margin: 0 !important; 
                overflow: hidden !important; /* 페이지 넘어감 방지 */
            }
            #header-bg { 
                background: none !important; 
                color: black !important; 
                box-shadow: none !important; 
                border-bottom: 2px solid #222; 
                border-radius: 0; 
                padding: 0.15rem 0; 
                margin-bottom: 0.15rem; 
                flex-shrink: 0 !important;
            }
            #header-bg svg, #header-controls, #toast-container { display: none !important; }
            .print-text-black { color: black !important; }
            .delete-btn, .drag-handle, .add-btn { display: none !important; }
            .max-w-full { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            
            .border-gray-300 { border-color: #666 !important; }
            .overflow-x-auto.border, .overflow-x-auto .border-b, .overflow-x-auto .border-r { border-color: #222 !important; }
            
            .bg-gray-50, .bg-red-50\/40, .bg-orange-50\/40, .bg-yellow-50\/40, .bg-green-50\/40, .bg-blue-50\/40, .bg-indigo-50\/40, .bg-pink-50\/40 { 
                background-color: #f9fafb !important; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            
            .print-scale-container {
                height: 100% !important;
                display: flex !important;
                flex-direction: column !important;
                line-height: 1.15 !important;
            }
            
            /* 스크롤 없애고 남은 공간 꽉 채우기 */
            .overflow-x-auto { 
                overflow: hidden !important; 
                flex-grow: 1 !important;
                display: flex !important;
                flex-direction: column !important;
            }
            
            /* 표 전체 영역 */
            .min-w-\[950px\], .min-w-\[1000px\] { 
                min-width: 100% !important; 
                flex-grow: 1 !important;
                display: flex !important;
                flex-direction: column !important;
            }
            
            /* 각 행들이 남은 높이를 유연하게 나눠 가지도록 설정 */
            .group\/row {
                flex-grow: 1 !important;
                flex-basis: 0 !important;
            }
            
            /* 최소 높이를 강제로 해제하여 한 페이지 안에 무조건 압축되도록 */
            .min-h-\[75px\], .min-h-\[60px\], .min-h-\[110px\], .min-h-\[80px\] {
                min-height: 0 !important;
            }
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'songgok-planner';
        const isMock = typeof __firebase_config === 'undefined';
        
        let app, auth, db;
        let currentUser = null;
        let unsubscribe = null;
        let currentPlans = [];
        let currentWeekMonday = getMonday(new Date());

        let editingPlanId = null;

        const academic2026Events = {
            '2026-03-01': { text: '*삼일절(공휴일)', type: 'holiday' },
            '2026-03-02': { text: '*대체공휴일', type: 'holiday' },
            '2026-03-03': { text: '*1학기 시작일(시업식, 입학식)', type: 'event' },
            '2026-05-01': { text: '*노동절', type: 'holiday' },
            '2026-05-04': { text: '*재량휴업일', type: 'holiday' },
            '2026-05-05': { text: '*어린이날', type: 'holiday' },
            '2026-05-24': { text: '*부처님오신날', type: 'holiday' },
            '2026-05-25': { text: '*대체공휴일', type: 'holiday' },
            '2026-06-03': { text: '*전국동시지방선거일', type: 'holiday' },
            '2026-06-06': { text: '*현충일', type: 'holiday' },
            '2026-07-17': { text: '*제헌절', type: 'holiday' },
            '2026-08-15': { text: '*광복절', type: 'holiday' },
            '2026-08-17': { text: '*대체공휴일', type: 'holiday' },
            '2026-08-20': { text: '*2학기 시작일', type: 'event' },
            '2026-09-23': { text: '*재량휴업일', type: 'holiday' },
            '2026-09-24': { text: '*추석연휴', type: 'holiday' },
            '2026-09-25': { text: '*추석연휴', type: 'holiday' },
            '2026-09-26': { text: '*추석연휴', type: 'holiday' },
            '2026-10-03': { text: '*개천절', type: 'holiday' },
            '2026-10-05': { text: '*대체공휴일', type: 'holiday' },
            '2026-10-09': { text: '*한글날', type: 'holiday' },
            '2026-12-25': { text: '*성탄절', type: 'holiday' },
            '2027-01-01': { text: '*신정', type: 'holiday' },
            '2027-01-05': { text: '*종업일, 졸업일', type: 'event' },
            '2027-02-06': { text: '*설연휴', type: 'holiday' },
            '2027-02-07': { text: '*설연휴', type: 'holiday' },
            '2027-02-08': { text: '*설연휴', type: 'holiday' },
            '2027-02-09': { text: '*대체공휴일', type: 'holiday' }
        };

        function getAcademicEvent(dateStr, dateObj) {
            if (academic2026Events[dateStr]) {
                return academic2026Events[dateStr];
            }
            const time = dateObj.getTime();
            const summerStart = new Date('2026-07-25T00:00:00').getTime();
            const summerEnd = new Date('2026-08-19T23:59:59').getTime();
            if (time >= summerStart && time <= summerEnd) {
                return { text: '*여름방학', type: 'vacation' };
            }
            const winterStart = new Date('2027-01-06T00:00:00').getTime();
            const winterEnd = new Date('2027-02-28T23:59:59').getTime();
            if (time >= winterStart && time <= winterEnd) {
                return { text: '*학년말 방학', type: 'vacation' };
            }
            return null;
        }

        const LOCAL_STORAGE_KEY_PREFIX = 'songgok_planner_';

        const localStore = {
            get: function(weekId) {
                const data = localStorage.getItem(LOCAL_STORAGE_KEY_PREFIX + weekId);
                return data ? JSON.parse(data) : [];
            },
            set: function(weekId, plans) {
                localStorage.setItem(LOCAL_STORAGE_KEY_PREFIX + weekId, JSON.stringify(plans));
            }
        };

        // 브라우저 로컬 저장소를 활용하여 깃허브 등 환경에서도 데이터 유지
        const initialWeekId = getWeekId(getMonday(new Date()));
        if (!localStorage.getItem(LOCAL_STORAGE_KEY_PREFIX + initialWeekId) && !localStorage.getItem('initialized_sample')) {
            localStore.set(initialWeekId, [
                { id: '1', dayIndex: 0, categoryIndex: 0, content: '*학교장(아산1지구 교장단 협의회, 오후, 산동초)', createdAt: new Date().toISOString() },
                { id: '2', dayIndex: 1, categoryIndex: 1, content: '*학교업무최적화 비대면연수(14:40, 마주온)', createdAt: new Date().toISOString() }
            ]);
            localStorage.setItem('initialized_sample', 'true');
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-600' : 'bg-gray-800';
            toast.className = `${bgColor} text-white px-4 py-2 rounded-full shadow-lg transition-all duration-300 opacity-0 translate-y-4 font-medium text-xs`;
            toast.textContent = msg;
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-4');
            });
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function getMonday(d) {
            const date = new Date(d);
            date.setHours(0, 0, 0, 0);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        function getWeekId(mondayDate) {
            const y = mondayDate.getFullYear();
            const m = String(mondayDate.getMonth() + 1).padStart(2, '0');
            const d = String(mondayDate.getDate()).padStart(2, '0');
            return `week-${y}-${m}-${d}`;
        }

        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function updateHeaders(monday) {
            const friday = addDays(monday, 4);
            const m_month = monday.getMonth() + 1;
            const m_date = monday.getDate();
            const f_month = friday.getMonth() + 1;
            const f_date = friday.getDate();
            
            document.getElementById('week-range').textContent = 
                `${monday.getFullYear()}. ${m_month}. ${m_date}. ~ ${f_month}. ${f_date}.`;

            const weekDays = ['월', '화', '수', '목', '금'];
            for (let i = 0; i < 5; i++) {
                const d = addDays(monday, i);
                const isToday = new Date().toDateString() === d.toDateString();
                const headerEl = document.getElementById(`header-day-${i}`);
                headerEl.textContent = `${d.getMonth() + 1}. ${d.getDate()} (${weekDays[i]})`;
                
                if(isToday) {
                    headerEl.classList.add('bg-teal-600', 'text-white');
                    headerEl.classList.remove('bg-teal-50/50', 'text-teal-800');
                } else {
                    headerEl.classList.remove('bg-teal-600', 'text-white');
                    headerEl.classList.add('bg-teal-50/50', 'text-teal-800');
                }
            }
        }

        function renderPlans() {
            for (let c = 0; c < 6; c++) {
                for (let d = 0; d < 5; d++) {
                    const el = document.getElementById(`list-${c}-${d}`);
                    if(el) {
                        el.innerHTML = '';
                        const cellWrapper = el.closest('.group\\/cell') || el.parentElement;
                        cellWrapper.classList.remove('bg-gray-100', 'text-gray-400');
                    }
                }
            }
            const etcEl = document.getElementById('list-etc');
            if(etcEl) etcEl.innerHTML = '';
            
            for (let d = 0; d < 5; d++) {
                const dayDate = addDays(currentWeekMonday, d);
                const dateKey = formatDateKey(dayDate);
                const eventInfo = getAcademicEvent(dateKey, dayDate);
                
                if (eventInfo && (eventInfo.type === 'holiday' || eventInfo.type === 'vacation')) {
                    for (let c = 0; c < 6; c++) {
                        const container = document.getElementById(`list-${c}-${d}`);
                        if (container) {
                            const cellWrapper = container.closest('.group\\/cell');
                            if (cellWrapper) {
                                cellWrapper.classList.add('bg-gray-100');
                            }
                            if (c === 0) {
                                const badge = document.createElement('div');
                                badge.className = 'p-1 bg-gray-200 border border-gray-300 text-gray-700 rounded text-[10px] font-bold mb-0.5 flex items-center gap-1 shadow-sm';
                                badge.innerHTML = `<span>📌</span><span>${escapeHtml(eventInfo.text)}</span>`;
                                container.appendChild(badge);
                            }
                        }
                    }
                } else if (eventInfo && eventInfo.type === 'event') {
                    const container = document.getElementById(`list-0-${d}`);
                    if (container) {
                        const badge = document.createElement('div');
                        badge.className = 'p-0.5 bg-teal-50 border border-teal-200 text-teal-800 rounded text-[10px] font-semibold mb-0.5 flex items-center gap-1 shadow-sm';
                        badge.innerHTML = `<span>📌</span><span>${escapeHtml(eventInfo.text)}</span>`;
                        container.appendChild(badge);
                    }
                }
            }

            currentPlans.forEach(plan => {
                let container = null;
                if (plan.categoryIndex === 6) {
                    container = document.getElementById('list-etc');
                } else {
                    container = document.getElementById(`list-${plan.categoryIndex}-${plan.dayIndex}`);
                }
                
                if (!container) return;
                
                const el = document.createElement('div');
                el.className = 'group/item relative p-1 bg-white/95 hover:bg-teal-50/90 border border-gray-200 rounded shadow-sm transition-all cursor-grab active:cursor-grabbing text-[15px] mb-0.5';
                el.draggable = true;
                el.id = `plan-${plan.id}`;
                
                el.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', plan.id);
                    el.classList.add('dragging');
                });
                
                el.addEventListener('dragend', () => {
                    el.classList.remove('dragging');
                });

                el.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    window.openEditModal(plan);
                });
                
                const contentHtml = escapeHtml(plan.content).replace(/\n/g, '<br>');
                
                el.innerHTML = `
                    <div class="text-gray-800 break-words leading-tight pr-5" title="더블클릭하여 수정">
                        ${contentHtml}
                    </div>
                    <div class="drag-handle absolute top-1 right-6 text-gray-300 hover:text-gray-500 opacity-0 group-hover/item:opacity-100 transition-opacity cursor-pointer" title="드래그하여 이동">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/></svg>
                    </div>
                    <button class="delete-btn absolute top-0.5 right-0.5 text-gray-400 hover:text-red-600 opacity-0 group-hover/item:opacity-100 transition-opacity bg-gray-50/90 hover:bg-red-50 rounded p-1 shadow-sm" onclick="window.deletePlan('${plan.id}')" aria-label="삭제">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                `;
                container.appendChild(el);
            });
        }

        window.handleDragOver = function(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        };

        window.handleDragLeave = function(e) {
            e.currentTarget.classList.remove('drag-over');
        };

        window.handleDrop = async function(e, targetCategoryIndex, targetDayIndex) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            
            const planId = e.dataTransfer.getData('text/plain');
            if (!planId) return;
            
            const plan = currentPlans.find(p => p.id === planId);
            if (!plan) return;
            
            plan.categoryIndex = targetCategoryIndex;
            plan.dayIndex = targetCategoryIndex === 6 ? 5 : targetDayIndex;
            
            const weekId = getWeekId(currentWeekMonday);
            
            if (isMock) {
                localStore.set(weekId, currentPlans);
                renderPlans();
                showToast("일정이 이동되었습니다.");
                return;
            }
            
            if (!currentUser) return showToast("권한이 없습니다.", "error");
            
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'weekly_plans', weekId);
            try {
                renderPlans();
                await setDoc(docRef, { plans: currentPlans }, { merge: true });
                showToast("일정이 이동되었습니다.");
            } catch(e) {
                showToast("이동 실패: " + e.message, "error");
                loadWeek(currentWeekMonday);
            }
        };

        function loadWeek(mondayDate) {
            updateHeaders(mondayDate);
            
            for(let c=0; c<6; c++) {
                for(let d=0; d<5; d++) {
                    const el = document.getElementById(`list-${c}-${d}`);
                    if(el) el.innerHTML = '';
                }
            }
            if(document.getElementById('list-etc')) document.getElementById('list-etc').innerHTML = '<div class="text-gray-400 text-xs p-1">로딩 중...</div>';

            if (isMock) {
                currentPlans = localStore.get(getWeekId(mondayDate));
                setTimeout(renderPlans, 100);
                return;
            }

            if (unsubscribe) unsubscribe();

            const weekId = getWeekId(mondayDate);
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'weekly_plans', weekId);
            
            unsubscribe = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    currentPlans = docSnap.data().plans || [];
                } else {
                    currentPlans = [];
                }
                renderPlans();
            }, (error) => {
                console.error("Firestore fetch error:", error);
                showToast("데이터를 불러오지 못했습니다.", "error");
            });
        }

        window.deletePlan = async function(planId) {
            const weekId = getWeekId(currentWeekMonday);
            const newPlans = currentPlans.filter(p => p.id !== planId);
            
            if (isMock) {
                localStore.set(weekId, newPlans);
                currentPlans = newPlans;
                renderPlans();
                showToast("일정이 삭제되었습니다.");
                return;
            }

            if (!currentUser) return showToast("권한이 없습니다.", "error");

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'weekly_plans', weekId);
            try {
                currentPlans = newPlans;
                renderPlans();
                await setDoc(docRef, { plans: newPlans }, { merge: true });
                showToast("일정이 삭제되었습니다.");
            } catch(e) {
                showToast("삭제 실패: " + e.message, "error");
                loadWeek(currentWeekMonday);
            }
        };

        let modalCategory = 0;
        let modalDay = 0;

        window.openAddModal = function(catIndex, dayIndex) {
            editingPlanId = null;
            modalCategory = catIndex;
            modalDay = dayIndex;
            
            document.getElementById('modal-delete-btn').classList.add('hidden');
            
            document.getElementById('modal-title').innerHTML = `
                <svg class="w-4 h-4 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                일정 추가
            `;
            
            const modal = document.getElementById('add-modal');
            const content = document.getElementById('add-modal-content');
            const input = document.getElementById('modal-input');
            
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            
            content.classList.remove('scale-95', 'opacity-0');
            content.classList.add('scale-100', 'opacity-100');
            
            input.value = '';
            input.focus();
        };

        window.openEditModal = function(plan) {
            editingPlanId = plan.id;
            
            document.getElementById('modal-delete-btn').classList.remove('hidden');
            
            document.getElementById('modal-title').innerHTML = `
                <svg class="w-4 h-4 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                일정 수정
            `;
            
            const modal = document.getElementById('add-modal');
            const content = document.getElementById('add-modal-content');
            const input = document.getElementById('modal-input');
            
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            
            content.classList.remove('scale-95', 'opacity-0');
            content.classList.add('scale-100', 'opacity-100');
            
            input.value = plan.content;
            input.focus();
        };

        window.closeAddModal = function() {
            editingPlanId = null;
            const modal = document.getElementById('add-modal');
            const content = document.getElementById('add-modal-content');
            
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        };

        window.deletePlanFromModal = function() {
            if (editingPlanId) {
                if(confirm("이 일정을 정말 삭제하시겠습니까?")) {
                    window.deletePlan(editingPlanId);
                    window.closeAddModal();
                }
            }
        };

        window.saveModalPlan = async function() {
            const input = document.getElementById('modal-input');
            let content = input.value.trim();
            
            if (!content) return showToast("일정 내용을 입력해주세요.", "error");
            
            if (!content.startsWith('*')) {
                content = '*' + content;
            }
            
            const weekId = getWeekId(currentWeekMonday);
            let newPlans = [];

            if (editingPlanId) {
                newPlans = currentPlans.map(p => {
                    if (p.id === editingPlanId) {
                        return { ...p, content };
                    }
                    return p;
                });
            } else {
                const newPlan = {
                    id: crypto.randomUUID(),
                    dayIndex: modalCategory === 6 ? 5 : modalDay,
                    categoryIndex: modalCategory,
                    content,
                    createdAt: new Date().toISOString()
                };
                newPlans = [...currentPlans, newPlan];
            }
            
            if (isMock) {
                localStore.set(weekId, newPlans);
                currentPlans = newPlans;
                renderPlans();
                window.closeAddModal();
                showToast(editingPlanId ? "일정이 수정되었습니다." : "일정이 추가되었습니다.");
                return;
            }
            
            if (!currentUser) return showToast("서버에 연결되지 않았습니다.", "error");
            
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'weekly_plans', weekId);
            const btn = document.getElementById('modal-save-btn');
            
            try {
                btn.disabled = true;
                btn.classList.add('opacity-50');
                
                await setDoc(docRef, { plans: newPlans }, { merge: true });
                window.closeAddModal();
                showToast(editingPlanId ? "일정이 수정되었습니다." : "일정이 등록되었습니다.");
            } catch(e) {
                showToast("저장 실패: " + e.message, "error");
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        };

        async function init() {
            if (!isMock) {
                try {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    currentUser = auth.currentUser;
                } catch (error) {
                    console.error("Firebase init error:", error);
                    showToast("시스템 연결에 문제가 있습니다. 읽기 전용으로 표시됩니다.", "error");
                }
            }
            
            document.getElementById('btn-prev').addEventListener('click', () => {
                currentWeekMonday = addDays(currentWeekMonday, -7);
                loadWeek(currentWeekMonday);
            });
            
            document.getElementById('btn-next').addEventListener('click', () => {
                currentWeekMonday = addDays(currentWeekMonday, 7);
                loadWeek(currentWeekMonday);
            });
            
            document.getElementById('btn-today').addEventListener('click', () => {
                currentWeekMonday = getMonday(new Date());
                loadWeek(currentWeekMonday);
            });

            document.getElementById('btn-print').addEventListener('click', (e) => {
                e.preventDefault();
                window.print();
            });

            loadWeek(currentWeekMonday);
        }

        init();
    </script>
</body>
</html>
